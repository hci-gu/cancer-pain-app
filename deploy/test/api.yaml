apiVersion: apps/v1
kind: Deployment
metadata:
    name: pre-rt-api-test
spec:
    replicas: 1
    selector:
        matchLabels:
            app: pre-rt-api-test
    template:
        metadata:
            labels:
                app: pre-rt-api-test
        spec:
            volumes:
                - name: pre-rt-api-persistent-storage-test
                  persistentVolumeClaim:
                      claimName: pre-rt-pv-claim-test
            containers:
                - name: pre-rt-api-test
                  image: 'registry.k8s.gu.se/appademin/pre-rt-api:1.0.1'
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                        name: web
                        protocol: TCP
                  env:
                    - name: ELKS_API_USERNAME
                      valueFrom:
                        secretKeyRef:
                          name: pre-rt-secret
                          key: 46elks-api-username
                    - name: ELKS_API_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: pre-rt-secret
                          key: 46elks-api-password
                  volumeMounts:
                      - mountPath: /pb/pb_data
                        name: pre-rt-api-persistent-storage-test
---
apiVersion: v1
kind: Service
metadata:
    name: pre-rt-api-service-test
spec:
    selector:
        app: pre-rt-api-test
    ports:
        - protocol: TCP
          port: 8080
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
    name: pre-rt-api-test
    annotations:
        kubernetes.io/tls-acme: 'true'
spec:
    host: pre-rt-api.test.appadem.in
    to:
        kind: Service
        name: pre-rt-api-service-test
        weight: 100
    port:
        targetPort: 8080
    tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    wildcardPolicy: None
